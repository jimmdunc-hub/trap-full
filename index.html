<style>
:root{--bg:#12100c;--panel:#1c1812;--ink:#f3e6c8;--muted:#a89878;--gunk:#6b8f3a;--warn:#e2a53a;--bad:#c4492c;--good:#d7c07a;--line:#3a3226}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-tap-highlight-color:transparent}
#app{max-width:440px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:100vh;min-height:100dvh}
header{display:flex;align-items:center;gap:8px}
header h1{font-size:1.1rem;letter-spacing:.08em;color:var(--good);flex:1}
.iconbtn{min-width:44px;min-height:44px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;font-size:1.1rem}
.meters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:.72rem;color:var(--muted)}
.bar{height:8px;background:#000;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;transition:width .4s}
#mP i{background:var(--bad)}#mR i{background:var(--good)}#mT i{background:var(--warn)}
#stage{position:relative;aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:linear-gradient(#2a2318,#1c1812);image-rendering:pixelated}
#stage img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#stageLabel{position:absolute;left:6px;top:6px;z-index:3;font-size:.7rem;line-height:1.2;color:#f3e6c4;text-transform:uppercase;letter-spacing:.1em;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.35);text-shadow:1px 1px 0 #000;pointer-events:none}
#stageLabel:empty{display:none}
#pipe{position:absolute;left:50%;bottom:0;width:60px;height:70px;margin-left:-30px;border:8px solid #8a8a7a;border-top:none;border-radius:0 0 40px 40px}
#water{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#6b8f3a,#4a5f22);opacity:.75;transition:height .6s}
#stage.art #water{background:url(assets/img/water_overlay.png) 0 0/100% 400% repeat-x,rgba(107,143,58,.35);opacity:.9;animation:wf .8s steps(4) infinite}
@keyframes wf{to{background-position:0 133.333%,0 0}}
#stage.art:not(.nobg) #pipe{display:none}
#stage.hasprop #pipe{display:none}
#stage.nobg{aspect-ratio:auto;height:120px}
#stage.nobg.tallart{aspect-ratio:16/9;height:auto}
#stage.endcard img.bg{top:8px;bottom:auto;height:auto}
#stage.art.cleanwater #water{background:url(assets/img/water_overlay.png) 0 0/100% 400% repeat-x,rgba(70,130,190,.25);filter:hue-rotate(110deg) saturate(.55);opacity:.55}
#stage .who.low{top:auto;bottom:6px}
#ov{position:absolute;display:none;background-size:100% 100%;image-rendering:pixelated;pointer-events:none}
#decor{position:absolute;inset:0;pointer-events:none}#decor .dc{position:absolute;background-repeat:no-repeat;image-rendering:pixelated}#decor .dc.anim{animation:p2 1.2s steps(2) infinite}#decor .dc.anim4{animation:p4 .8s steps(4) infinite}
body.toastPad{padding-bottom:var(--toastH,0px)}
.spr{position:absolute;bottom:4%;image-rendering:pixelated;background-repeat:no-repeat;background-size:auto 100%}
#pete{left:6%;width:15%;aspect-ratio:48/64;background-image:url(assets/img/pete_idle.png);background-size:200% 100%;animation:p2 1.6s steps(2) infinite}
#pete.work{background-image:url(assets/img/pete_work.png);background-size:400% 100%;animation:p4 .8s steps(4) infinite}
#rhonda{left:26%;width:15%;aspect-ratio:48/64;background-image:url(assets/img/rhonda_cake.png);background-size:200% 100%;animation:p2 2s steps(2) infinite;display:none}
/* steps(N) sheets: background-position % moves (container - image) * p, so frame k needs k/(N-1); end at N/(N-1) */
@keyframes p2{to{background-position:200% 0}}@keyframes p4{to{background-position:133.333% 0}}
#kevin.spr{background-color:transparent;border:none;border-radius:0;background-size:300% 100%;animation:k3 .9s steps(3) infinite}
#kevin.spr::before{content:none}
@keyframes k3{to{background-position:150% 0}}
#endtip{position:absolute;left:0;right:0;bottom:0;height:33.3%;display:none;align-items:center;justify-content:center;padding:4px 10px;font-size:.78rem;line-height:1.25;text-align:center;color:var(--good);background:rgba(18,16,12,.55)}
.meters img,.toasticon{width:12px;height:12px;image-rendering:pixelated;vertical-align:-1px;margin-right:3px}
.toasticon{width:20px;height:20px;vertical-align:-5px}
#logo{width:min(80vw,360px);image-rendering:pixelated}
#kevin{position:absolute;bottom:6px;right:18px;border-radius:50% 50% 40% 40%;background:#5e4a2a;border:2px solid #000;transition:all .5s;display:flex;align-items:center;justify-content:center;font-size:.6rem}
#kevin::before{content:"• •";color:#fff}
#stage .who{position:absolute;right:6px;top:6px;z-index:3;font-size:.7rem;line-height:1.2;color:var(--good);background:rgba(0,0,0,.6);padding:2px 6px;border-radius:3px;text-shadow:1px 1px 0 #000;pointer-events:none}
#stage .who:empty{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
#text{font-size:1.02rem;line-height:1.45}
#text em{color:var(--gunk)}
#choices{display:flex;flex-direction:column;gap:8px}
button.choice{min-height:48px;text-align:left;padding:10px 12px;background:#2a2318;color:var(--ink);border:1px solid var(--line);border-radius:8px;font-size:.98rem;cursor:pointer}
button.choice:active{transform:scale(.99)}
button.choice .k{color:var(--muted);margin-right:6px}
button.choice.locked{opacity:.5;cursor:not-allowed}
button.choice .hint{display:block;font-size:.75rem;color:var(--warn);margin-top:2px}
button:focus-visible{outline:3px solid var(--good);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:420px;width:calc(100% - 24px);background:#0d0b08;border:2px solid var(--good);border-radius:10px;padding:12px;font-size:.9rem;display:none;z-index:20}
#toast b{color:var(--good)}
#app.shake{animation:shake .35s linear}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.end h2{color:var(--good);font-size:1.4rem;margin-bottom:6px}
.end h3{font-size:.9rem;color:var(--warn);margin:12px 0 6px}
.end ul{padding-left:18px;font-size:.88rem;line-height:1.4}
.end li{margin-bottom:4px}
.big{min-height:48px;width:100%;margin-top:8px;border-radius:8px;border:1px solid var(--line);background:var(--good);color:#12100c;font-weight:700;font-size:1rem;cursor:pointer}
.big.alt{background:#2a2318;color:var(--ink)}
a.big{display:flex;align-items:center;justify-content:center;box-sizing:border-box;text-decoration:none;text-align:center}
.big.merch{background:var(--warn);color:#12100c;min-height:56px;font-size:1.1rem;letter-spacing:.02em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.followLink{display:block;width:max-content;max-width:100%;margin:8px auto 0;padding:12px 16px;min-height:44px;box-sizing:border-box;color:var(--warn);font-size:.9rem;text-align:center;text-decoration:underline;text-underline-offset:3px}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,8,6,.95);z-index:30;padding:24px;text-align:center;cursor:pointer}
#overlay h1{font-size:clamp(2.5rem,12vw,4.5rem);color:var(--good);letter-spacing:.05em}
#overlay p{color:var(--muted)}
#overlay .tap{font-weight:700;font-size:1.3rem;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.4}}
#overlay.hidden{display:none}
#debug{position:fixed;top:env(safe-area-inset-top);left:0;background:#000c;color:#0f0;font:11px monospace;padding:4px;z-index:40;max-width:60vw;display:none}
footer{font-size:.7rem;color:var(--muted);text-align:center;margin-top:auto}

.is-hidden{display:none!important}
#overlay{cursor:default;overflow:auto}
#overlay .tap{cursor:pointer}
#challengeBanner{max-width:400px;width:100%;box-sizing:border-box;background:#3a1d14;border:2px solid var(--warn);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:.95rem;line-height:1.35}#challengeBanner b{color:var(--warn);font-size:1.1rem}
.santoStamp{float:right;transform:rotate(-8deg);border:3px double #e8b04a;color:#e8b04a;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:6px;margin:0 0 6px 8px}.santoChip{display:inline-block;background:#2a2318;border:1px solid #e8b04a;color:#e8b04a;border-radius:8px;padding:0 6px;font-size:.85em}
.badgeCard{margin:10px auto 0;max-width:420px;text-align:center;background:#2a2318;border:2px solid var(--good);border-radius:10px;padding:10px;color:var(--ink);font-size:.9rem}
#codeTip{max-width:400px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:.88rem;line-height:1.4;color:var(--ink)}
#codeTip b{color:var(--warn)}
#overlay .big,#select .big{max-width:400px}
#overlay .row{display:flex;gap:8px;width:100%;max-width:400px;align-items:center}
#overlay .row .big{flex:1;margin-top:0}
button{touch-action:manipulation}
#select{max-width:440px;margin:0 auto;padding:12px;min-height:100vh;min-height:100dvh}
#select header{margin-bottom:10px}
.epcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.epcard img,.epcard .ph{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;image-rendering:pixelated;display:block}
.epcard .ph{display:flex;align-items:center;justify-content:center;background:linear-gradient(#2a2318,#1c1812);color:var(--good);font-size:2rem;font-weight:700}
.epcard .meta{margin-top:8px;font-size:.88rem;line-height:1.5}
.epcard .new{background:var(--bad);color:#fff;border-radius:4px;padding:1px 6px;font-size:.72rem;font-weight:700;margin-left:6px}
.epcard .test{border:1px solid var(--muted);color:var(--muted);border-radius:4px;padding:1px 6px;font-size:.72rem;font-weight:700;margin-left:6px}
.epcard .btns{display:flex;gap:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:10px;font-size:.88rem;color:var(--muted)}
.stats b{color:var(--ink)}.stats i{color:var(--bad);font-style:normal;font-weight:700}
.why{margin-top:8px;font-size:.88rem;color:var(--muted)}
.cnt{text-align:center;color:var(--muted);margin-top:8px;font-size:.85rem}
#epTitle{font-size:.75rem;color:var(--muted);text-align:center}
.dcard{display:block;margin-top:6px;padding:6px 8px;border:1px dashed var(--warn);border-radius:6px;font-size:.85rem;color:var(--warn)}
.dcard em{color:var(--warn)!important}
.panel h3{color:var(--warn);font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
#prop{left:40%;bottom:8%;display:none;background-size:100% 100%}
#prop.f2{background-size:200% 100%;animation:p2 1s steps(2) infinite}
#dale{right:30%;width:15%;aspect-ratio:48/64;background-size:200% 100%;animation:p2 1.8s steps(2) infinite;display:none}
#dcardSpr{right:6%;top:18%;bottom:auto;width:10%;aspect-ratio:24/16;background-image:url(assets/img/prop_dale_card.png);background-size:200% 100%;animation:p2 1.2s steps(2) infinite;display:none}
.dcard img{display:block;width:min(100%,264px);image-rendering:pixelated;margin-bottom:4px}
.panel img.big{display:block;width:min(60%,192px);margin:8px auto;image-rendering:pixelated}
#app.compact footer{margin-top:12px}
#panelContinue{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(416px,calc(100% - 24px));z-index:20;box-shadow:0 -6px 16px rgba(0,0,0,.45)}
body.panelOpen #app{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#cardSave{position:fixed;inset:0;z-index:60;background:rgba(10,8,6,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;overflow:auto}
#cardSave img{width:min(100%,720px);height:auto;background:#000}
#cardSave p{max-width:22rem;text-align:center}
#cardSave .big{max-width:22rem}
</style>

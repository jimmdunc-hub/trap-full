<style>
:root{--bg:#12100c;--panel:#1c1812;--ink:#f3e6c8;--muted:#a89878;--gunk:#6b8f3a;--warn:#e2a53a;--bad:#c4492c;--good:#d7c07a;--line:#3a3226}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-tap-highlight-color:transparent}
#app{max-width:440px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:100vh;min-height:100dvh}
header{display:flex;align-items:center;gap:8px}
header h1{font-size:1.1rem;letter-spacing:.08em;color:var(--good);flex:1}
.iconbtn{min-width:44px;min-height:44px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;font-size:1.1rem}
.meters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:.72rem;color:var(--muted)}
.bar{height:8px;background:#000;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;transition:width .4s}
#mP i{background:var(--bad)}#mR i{background:var(--good)}#mT i{background:var(--warn)}
#stage{position:relative;aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:linear-gradient(#2a2318,#1c1812);image-rendering:pixelated}
#stage img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#stageLabel{position:absolute;left:8px;top:6px;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
#pipe{position:absolute;left:50%;bottom:0;width:60px;height:70px;margin-left:-30px;border:8px solid #8a8a7a;border-top:none;border-radius:0 0 40px 40px}
#water{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#6b8f3a,#4a5f22);opacity:.75;transition:height .6s}
#stage.art #water{background:url(assets/img/water_overlay.png) 0 0/100% 400% repeat-x,rgba(107,143,58,.35);opacity:.9;animation:wf .8s steps(4) infinite}
@keyframes wf{to{background-position:0 133.333%,0 0}}
#stage.art:not(.nobg) #pipe{display:none}
#stage.nobg{aspect-ratio:auto;height:120px}
.spr{position:absolute;bottom:4%;image-rendering:pixelated;background-repeat:no-repeat;background-size:auto 100%}
#pete{left:6%;width:15%;aspect-ratio:48/64;background-image:url(assets/img/pete_idle.png);background-size:200% 100%;animation:p2 1.6s steps(2) infinite}
#pete.work{background-image:url(assets/img/pete_work.png);background-size:400% 100%;animation:p4 .8s steps(4) infinite}
#rhonda{left:26%;width:15%;aspect-ratio:48/64;background-image:url(assets/img/rhonda_cake.png);background-size:200% 100%;animation:p2 2s steps(2) infinite;display:none}
@keyframes p2{to{background-position:200% 0}}@keyframes p4{to{background-position:400% 0}}
#kevin.spr{background-color:transparent;border:none;border-radius:0;background-size:300% 100%;animation:k3 .9s steps(3) infinite}
#kevin.spr::before{content:none}
@keyframes k3{to{background-position:300% 0}}
#endtip{position:absolute;left:0;right:0;bottom:0;height:33.3%;display:none;align-items:center;justify-content:center;padding:4px 10px;font-size:.78rem;line-height:1.25;text-align:center;color:var(--good);background:rgba(18,16,12,.55)}
.meters img,.toasticon{width:12px;height:12px;image-rendering:pixelated;vertical-align:-1px;margin-right:3px}
.toasticon{width:20px;height:20px;vertical-align:-5px}
#logo{width:min(80vw,360px);image-rendering:pixelated}
#kevin{position:absolute;bottom:6px;right:18px;border-radius:50% 50% 40% 40%;background:#5e4a2a;border:2px solid #000;transition:all .5s;display:flex;align-items:center;justify-content:center;font-size:.6rem}
#kevin::before{content:"• •";color:#fff}
#stage .who{position:absolute;right:8px;top:6px;font-size:.7rem;color:var(--good)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
#text{font-size:1.02rem;line-height:1.45}
#text em{color:var(--gunk)}
#choices{display:flex;flex-direction:column;gap:8px}
button.choice{min-height:48px;text-align:left;padding:10px 12px;background:#2a2318;color:var(--ink);border:1px solid var(--line);border-radius:8px;font-size:.98rem;cursor:pointer}
button.choice:active{transform:scale(.99)}
button.choice .k{color:var(--muted);margin-right:6px}
button.choice.locked{opacity:.5;cursor:not-allowed}
button.choice .hint{display:block;font-size:.75rem;color:var(--warn);margin-top:2px}
button:focus-visible{outline:3px solid var(--good);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:420px;width:calc(100% - 24px);background:#0d0b08;border:2px solid var(--good);border-radius:10px;padding:12px;font-size:.9rem;display:none;z-index:20}
#toast b{color:var(--good)}
#app.shake{animation:shake .35s linear}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.end h2{color:var(--good);font-size:1.4rem;margin-bottom:6px}
.end h3{font-size:.9rem;color:var(--warn);margin:12px 0 6px}
.end ul{padding-left:18px;font-size:.88rem;line-height:1.4}
.end li{margin-bottom:4px}
.big{min-height:48px;width:100%;margin-top:8px;border-radius:8px;border:1px solid var(--line);background:var(--good);color:#12100c;font-weight:700;font-size:1rem;cursor:pointer}
.big.alt{background:#2a2318;color:var(--ink)}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,8,6,.95);z-index:30;padding:24px;text-align:center;cursor:pointer}
#overlay h1{font-size:clamp(2.5rem,12vw,4.5rem);color:var(--good);letter-spacing:.05em}
#overlay p{color:var(--muted)}
#overlay .tap{font-weight:700;font-size:1.3rem;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.4}}
#overlay.hidden{display:none}
#debug{position:fixed;top:env(safe-area-inset-top);left:0;background:#000c;color:#0f0;font:11px monospace;padding:4px;z-index:40;max-width:60vw;display:none}
footer{font-size:.7rem;color:var(--muted);text-align:center;margin-top:auto}
</style>

const TIPS={
trapSeal:"A P-trap holds a plug of water (the trap seal, 2–4 in. deep by code) that blocks sewer gas from coming into the house.",
vent:"Drain vents let air into the pipes so water flows and traps don't get siphoned dry. Gurgling or slow drains can mean a clog or a vent problem. Changing or adding vents is code work; call a licensed plumber.",
chemicals:"Skip caustic drain openers — snake or auger instead. They can damage old pipes and burn you, and never plunge or snake into a drain with chemical cleaner in it — it can splash back. Never mix drain chemicals.",
ppe:"Gloves and eye protection for any clog work. Drain water is sewage-adjacent.",
multiFixture:"If the tub backs up when the sink drains, the clog is downstream in a shared line or the main — not just the sink trap. Sewage backs up at the lowest fixture first. Main-line and sewer clogs are a job for a licensed plumber.",
lowestFixture:"A main-line backup shows up at the lowest drain in the house first (a downstairs tub, shower or floor drain). If that one's filling up, it's the sewer line; call a licensed plumber.",
overflow:"Use a cup plunger on a tub or sink, and block the overflow (wet rag) — or the other drain on a double sink — so it pushes on the clog instead of air.",
mainShutoff:"Know where your main shutoff is. Often a house-side valve where the line enters (pier-and-beam: under the house; slab: near the front hose bib or garage) and the utility valve in the curb meter box, which belongs to the water utility — call them or a licensed plumber before touching it.",
fireAnts:"Texas meter boxes are a favorite fire-ant spot. Open the lid with a tool and look before you reach.",
slipJoint:"Slip-joint trap nuts seal with the washer, not tape. Bevel faces the joint; hand-tight plus about a quarter turn — don't crank plastic. Thread tape is for threads.",
sTrap:"S-traps can siphon their own seal dry, so the IPC (1002.3) and UPC prohibit them in new work. A licensed plumber installs a properly vented P-trap.",
fog:"Fats, oils, grease (dairy too) and hair are top clog causes. Grease goes in the trash, not the drain.",
cleanout:"A main-line clog is cleared through the cleanout, usually outside near the house. Tree roots in old clay or cast-iron lines are a common Texas cause. Running a sewer machine is a job for a licensed plumber.",
auger:"Let the cable do the work: feed it slow and don't force it. Forcing kinks the cable or makes it whip. Gloves on, hands clear.",
noForce:"Don't force a snake; you can kink the cable or crack old pipe. Let the head do the work.",
mainFirst:"Find and close the house main before you open up a pressurized line.",
chemPlunge:"Never plunge after using chemical drain cleaner, because it can splash caustic on you. Tell the plumber what you poured.",
testRun:"After a repair, run water and check every joint for drips before you call it done."
};

const scenes={
s01:{who:"Darlene (radio)",bg:"truck",text:"Radio crackles. Darlene: \"Birthday party off Mockingbird Lane in Dallas. Upstairs sink's 'a little slow.' Mom's holding a cake like a hostage.\"",

          {label:"\"Define slow.\"",next:"s02",effects:{R:3,T:-5},sfx:"radio_static"}]},

s08:{who:"the line",bg:"bath_cabinet",drift:true,text:"The snake goes in cheerful and comes back offended. Somewhere, {kevin} stirs.",

s12:{who:"the possum",bg:"crawlspace",text:"Possum. Not hostile. Judging. The valve is behind it.",

          {label:"Wait it out",next:"s14",effects:{P:15}},
          {label:"Crawl past, respectfully",next:"s14",effects:{R:4,T:-6},correct:true,tip:"mainShutoff"}]},
s13:{who:"the house shutoff",bg:"house_shutoff",text:"The house shutoff sits in a valve box by the front hose bib, lid rusted shut. Fire ants have a subdivision. The curb valve is the water utility's; if the house valve won't hold, call the water department.",
 choices:[{label:"Lift the lid with a lid hook and check for ants",next:"s14",effects:{R:4},correct:true,tip:"fireAnts"},
          {label:"Ask Dale where the house valve is",next:"s14",effects:{R:5},setFlags:["dale"],requires:{R:">=60"},lockHint:"Reputation 60+"},
          {label:"Reach in bare-handed",next:"s14",effects:{R:-6,T:-6,P:5},correct:false,tip:"fireAnts",sfx:"fire_ant_sting"}]},
s14:{who:"the house",bg:"party",onEnter:["mainOff"],text:"Main is off. The quiet is worse. Something settles like it took a plea deal.",

function cmp(val,expr){const m=/^(>=|<=|>|<|==)?\s*(-?\d+)$/.exec(expr);const op=m[1]||"==",n=+m[2];
 return op===">="?val>=n:op==="<="?val<=n:op===">"?val>n:op==="<"?val<n:val===n;}
function meets(req,st){if(!req)return true;
 for(const k of ["P","R","T"])if(req[k]!==undefined&&!cmp(st[k],req[k]))return false;
 if(req.flags&&!req.flags.every(f=>st.flags[f]))return false;
 if(req.notFlags&&req.notFlags.some(f=>st.flags[f]))return false;return true;}
function kevinName(P){return P>=70?"Kevin Ray Jr.":P>=40?"Kevin Ray":"Kevin";}
function resolveEnding(st){const f=st.flags;
 if(st.P>=100)return"endBlowout";
 if(f.evidence&&f.dale)return"endYogurt";
 if(st.R>=75&&f.peppers&&(f.tested||st.R>=80))return"endPepper";
 if(st.R>=55&&st.T>=35&&(f.tested||st.R>=80))return"endPro";
 return"endNote";}
function cloneSt(s){return{scene:s.scene,P:s.P,R:s.R,T:s.T,flags:Object.assign({},s.flags),history:(s.history||[]).slice(),correct:s.correct||0,total:s.total||0,tipsWrong:(s.tipsWrong||[]).slice(),tipsRight:(s.tipsRight||[]).slice()};}
// enter scene: returns list of events; may redirect
function enterScene(st,id,ev){
 for(let guard=0;guard<5;guard++){
  st.scene=id;const sc=scenes[id];if(sc.end)return;
  if(sc.onEnter)sc.onEnter.forEach(f=>st.flags[f]=true);
  if(sc.drift&&!st.flags.mainOff){st.P=clamp(st.P+5);ev.push({type:"drift"});
   if(st.P>=100){id="endBlowout";continue;}}
  if(sc.enterTip)ev.push({type:"tip",tip:sc.enterTip});
  if(st.T<=25&&!st.flags.rhondaLeft){st.flags.rhondaLeft=true;ev.push({type:"rhonda"});}
  if(st.P>=100){id="endBlowout";continue;}
  if(sc.forceIf&&meets(sc.forceIf,st)){id=sc.forceIf.to;continue;}
  return;}
}
function applyChoice(st,c,ev){
 const before={P:st.P,R:st.R};const e=Object.assign({},c.effects||{});
 if(c.chemPenalty&&st.flags.chemicals)e.R=(e.R||0)-5;
 let tip=c.tip,correct=c.correct,note=c.note;
 if(c.chemPlunge&&st.flags.chemicals){e.R=(e.R||0)-10;e.P=(e.P||0)+5;tip="chemPlunge";correct=false;note="The plunger burps the drain cleaner right back up. Caustic splash-back on your sleeve; the cabinet now smells like a pool fire.";}
 for(const k of ["P","R","T"])if(e[k])st[k]=clamp(st[k]+e[k]);
 (c.setFlags||[]).forEach(f=>st.flags[f]=true);
 if(correct!==undefined){st.total++;if(correct)st.correct++;}
 if(note)ev.push({type:"note",text:note});
 if(tip){(correct===false?st.tipsWrong:st.tipsRight).push(tip);ev.push({type:"tip",tip:tip});}
 st.history.push(st.scene+":"+c.label);
 ev.push({type:"delta",dP:st.P-before.P,dR:st.R-before.R});
 let next;
 if(st.P>=100)next="endBlowout";
 else if(c.next==="resolve"){if(!st.flags.tested){st.R=clamp(st.R-10);ev.push({type:"callback"});}next=resolveEnding(st);}
 else{next=c.next;
  // cleanout-first route: s11C -> s23 -> s15 -> s24
  if(st.flags.cleanoutFirst){if((st.scene==="s23"||st.scene==="s23t")&&next==="s24")next="s15";else if(st.scene==="s15"&&next==="s23")next="s24";}}
 enterScene(st,next,ev);
}

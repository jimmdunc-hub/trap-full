<div id="intro"><h1 style="margin:0;color:#ef4b3a">Pepper Run</h1><p id="blurb">At Ms. Reyes’s slab job, Pete sends the Boy to the van for a bucket, chisel and dust mask. 30–45 seconds, grab the chilies.</p><div id="levels" role="group" aria-label="Pick a van run"></div>

<script>
(function(){const q=new URLSearchParams(location.search);const go=document.getElementById("go"),out=document.getElementById("out"),lv=document.getElementById("levels"),blurb=document.getElementById("blurb");
 const text={high:"Right tools, first try. +3 Patience (or a botched van run gets fixed).",mid:"Normal van run, no change.",low:"He also brought a drink. −5 Patience on top of the normal van run."};
 // Van runs, one per TRAP FULL episode. A run unlocks with its episode (same dates as TRAP FULL's isReleased); ?dev=1 shows all for QA.
 const LV=[{id:"ep02",name:"Ep2 Slab",rel:"",b:"At Ms. Reyes’s slab job, Pete sends the Boy to the van for a bucket, chisel and dust mask. 30–45 seconds, grab the chilies."},
  {id:"ep03",name:"Ep3 Haunted",rel:"",b:"Walt’s mystery leak. Pete needs a drywall saw, inspection light and shop vac from the van."},
  {id:"ep04",name:"Ep4 Alley",rel:"2026-11-06T08:00:00-06:00",b:"Gloria’s water heater. Pete needs the element tester from the van."},
  {id:"ep05",name:"Ep5 Hold",rel:"2026-11-11T08:00:00-06:00",b:"Hold, Please. Run the driveway job site to the van on the beat of the hold music."}];
 const dev=q.get("dev")==="1",open=LV.filter(l=>dev||!l.rel||Date.now()>=Date.parse(l.rel));
 let cur=(open.find(l=>l.id===q.get("level"))||open[open.length-1]).id;
 function pick(id){cur=id;const l=LV.find(x=>x.id===id);blurb.textContent=l.b;for(const b of lv.children)b.setAttribute("aria-pressed",String(b.dataset.id===id));}
 for(const l of open){const b=document.createElement("button");b.type="button";b.dataset.id=l.id;b.textContent=l.name;b.onclick=()=>pick(l.id);lv.appendChild(b);}
 pick(cur);
 const m=document.getElementById("merchBtn");m.addEventListener("click",()=>{if(dev)return;try{const gc=window.goatcounter;if(gc&&typeof gc.count==="function")gc.count({path:"click/merch-pepperrun",title:"Get the Merch (Pepper Run)",event:true});}catch(e){}});
 function run(){go.disabled=true;PepperRun.start({level:cur,assetBase:"assets/img/",forceResult:q.get("pepperResult"),onDone:function(r){go.disabled=false;go.textContent="Run again";
  out.textContent=(r.skipped?"Skipped (normal result). ":"Chilies "+r.chilies+"/"+r.total+(r.fell?", fell into the hedge":"")+(r.fullClear?", full clear (+1 to the pepper jar)":"")+". ")+(r.skipped?"":text[r.band]);window.__pepperLast=r;m.href=PepperRun.MERCH_LINK;m.hidden=false;m.style.display="flex";}});}
 go.onclick=run;})();
</script></body></html>

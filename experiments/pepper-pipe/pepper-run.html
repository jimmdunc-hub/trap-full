<div id="intro"><h1 style="margin:0;color:#ef4b3a">Pepper Run</h1><p>At Ms. Reyes’s slab job, Pete sends the Boy to the van for a bucket, chisel and dust mask. 30–45 seconds, grab the chilies.</p>

<script>
(function(){const q=new URLSearchParams(location.search);const go=document.getElementById("go"),out=document.getElementById("out");
 const text={high:"Right tools, first try. +3 Patience (or a botched van run gets fixed).",mid:"Normal van run, no change.",low:"He also brought a drink. −5 Patience on top of the normal van run."};
 function run(){go.disabled=true;PepperRun.start({assetBase:"../../assets/img/",forceResult:q.get("pepperResult"),onDone:function(r){go.disabled=false;go.textContent="Run again";
